name: Windows CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci
  cancel-in-progress: false

jobs:
  version:
    name: Increment patch version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref == 'refs/heads/master' && github.ref || github.sha }}
      - name: Increment and record release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./packaging/windows/Test-ReleaseVersion.ps1
          $version = ./packaging/windows/Update-ReleaseVersion.ps1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pubspec.yaml README.md
          git commit -m "Bump version to $version [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw 'Version commit failed.' }
          if ($env:RELEASE_REF -eq 'refs/heads/master') {
            git push origin HEAD:master
            if ($LASTEXITCODE -ne 0) { throw 'Version push failed. Master may have changed; rerun the workflow.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Upload versioned source for manual runs outside master
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: release-version-files
          path: |
            pubspec.yaml
            README.md

  package:
    name: Test, build, and verify Windows packages
    needs: version
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.ref == 'refs/heads/master' && needs.version.outputs.commit || github.sha }}
      - name: Download versioned files for manual runs outside master
        if: github.ref != 'refs/heads/master'
        uses: actions/download-artifact@v8
        with:
          name: release-version-files
          path: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true
      - name: Set release version
        shell: pwsh
        run: |
          "RELEASE_VERSION=${{ needs.version.outputs.version }}" >> $env:GITHUB_ENV
      - name: Install required OCR capabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($language in @('en-US', 'it-IT')) {
            $name = "Language.OCR~~~$language~0.0.1.0"
            if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
              $result = Add-WindowsCapability -Online -Name $name
              if ($result.RestartNeeded) { throw "OCR installation requires a restart: $name" }
            }
            if ((Get-WindowsCapability -Online -Name $name).State -ne 'Installed') {
              throw "Required Windows OCR capability is unavailable: $name"
            }
          }
      - name: Run release checks
        shell: pwsh
        run: ./Test-People.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: ./packaging/windows/Install-InnoSetup.ps1
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./Build-WindowsRelease.ps1 -Version $env:RELEASE_VERSION -BuildNumber 1 -InnoSetupCompiler ./build/release-tools/inno/ISCC.exe
      - name: Verify packaged distributions
        shell: pwsh
        run: ./packaging/windows/Test-WindowsPackages.ps1 -Version $env:RELEASE_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: People-windows-x64
          path: |
            build/releases/*/*-setup.exe
            build/releases/*/*-portable.zip
            build/releases/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results
          path: |
            build/test-results/
            coverage/lcov.info
          if-no-files-found: warn

  publish:
    if: github.ref == 'refs/heads/master'
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: People-windows-x64
          path: release
      - name: Publish draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
          RELEASE_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          mapfile -d '' files < <(find release -type f -print0)
          gh release create "$RELEASE_TAG" "${files[@]}" --target "$RELEASE_COMMIT" --draft --generate-notes --title "People $RELEASE_TAG"
